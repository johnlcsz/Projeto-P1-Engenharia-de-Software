{% extends "base.html" %}
{% block title %}Quero Jogar — SEMAG{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/principal.css') }}">
{% endblock %}

{% block content %}

<section class="boas-vindas">
  <div class="boas-vindas-avatar">{{ session['usuario_nome'][0]|upper }}</div>
  <div class="boas-vindas-info">
    <h1 class="boas-vindas-titulo">Quero Jogar</h1>
    <p class="boas-vindas-sub">Sua lista de desejos</p>
  </div>
</section>

<section class="catalogo">
  <h2 class="section-title">Jogos salvos</h2>
  <div class="jogos-grid">
    <p style="color: #8884a0; font-size: 13px;">Nenhum jogo salvo ainda.</p>
  </div>
</section>

{% endblock %}
